[package]
name = "sistars-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Authoritative Arena server (REST + OpenAPI + WebSocket Spectator Mode) for SI-Stars"

[dependencies]
sistars-engine = { path = "../engine" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
futures-util = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.26"
