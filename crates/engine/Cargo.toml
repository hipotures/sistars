[package]
name = "sistars-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic headless 4X simulation engine for SI-Stars"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
